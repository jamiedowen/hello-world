<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JarradBird</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b1d2a;
    font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 720px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
    background: #7ec9e8;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: linear-gradient(#8fd3f4, #d8f3dc);
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #fff;
    background: rgba(10, 30, 40, 0.55);
    padding: 20px;
  }
  #overlay h1 {
    font-size: 2.6em;
    margin: 0 0 6px 0;
    color: #ffd447;
    text-shadow: 3px 3px 0 #b5651d, -1px -1px 0 #2a1a08;
    letter-spacing: 1px;
  }
  #overlay p {
    margin: 6px 0;
    font-size: 1em;
    max-width: 320px;
    line-height: 1.4;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
  }
  #overlay .sub {
    font-size: 0.85em;
    opacity: 0.9;
  }
  .btn {
    margin-top: 18px;
    padding: 12px 30px;
    font-size: 1.1em;
    font-weight: bold;
    border: none;
    border-radius: 30px;
    background: linear-gradient(#ffe08a, #f4a825);
    color: #4a2c00;
    box-shadow: 0 4px 0 #a86b00;
    cursor: pointer;
  }
  .btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #a86b00;
  }
  #scoreDisplay {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    text-align: center;
    color: #fff;
    font-size: 2em;
    font-weight: bold;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.35);
    pointer-events: none;
    z-index: 5;
  }
  #rollCount {
    position: absolute;
    top: 62px;
    left: 0;
    right: 0;
    text-align: center;
    color: #ffe9b0;
    font-size: 1em;
    font-weight: bold;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
    pointer-events: none;
    z-index: 5;
  }
  #hidden { display: none; }
  footer {
    position: absolute;
    bottom: 6px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.7em;
    color: rgba(255,255,255,0.5);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="gameContainer">
    <canvas id="game"></canvas>
    <div id="scoreDisplay">0</div>
    <div id="rollCount">🥐 x0</div>

    <div id="overlay">
      <h1>JarradBird</h1>
      <p>Flap Jarrad through the celery sticks and gobble up Greggs sausage rolls along the way!</p>
      <p class="sub">Tap, click, or press Space to flap.</p>
      <button class="btn" id="startBtn">Start Flapping</button>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('gameContainer');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const rollCountDisplay = document.getElementById('rollCount');
  const birdImg = document.getElementById('birdImg');

  let W, H, DPR;
  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = container.clientWidth;
    H = container.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Game constants ----------
  const GRAVITY = 1500;      // px/s^2
  const FLAP_VELOCITY = -420; // px/s
  const MAX_FALL_SPEED = 640;
  const PIPE_GAP = 180;
  const PIPE_WIDTH = 64;
  const PIPE_SPEED = 170; // px/s
  const PIPE_INTERVAL = 1500; // ms between pipe spawns
  const BIRD_SIZE = 46;
  const ROLL_SIZE = 30;

  let state = 'ready'; // ready, playing, over
  let bird, pipes, rolls, particles;
  let score = 0, rollsEaten = 0, best = 0;
  let lastTime = 0, spawnTimer = 0;
  let groundOffset = 0;

  try { best = parseInt(localStorage.getItem('jarradbird_best') || '0', 10) || 0; } catch(e) { best = 0; }

  function resetGame() {
    bird = {
      x: W * 0.28,
      y: H * 0.45,
      vy: 0,
      rotation: 0
    };
    pipes = [];
    rolls = [];
    particles = [];
    score = 0;
    rollsEaten = 0;
    spawnTimer = 0;
    scoreDisplay.textContent = '0';
    rollCountDisplay.textContent = '🥐 x0';
  }

  function spawnPipe() {
    const margin = 60;
    const gapCenter = margin + Math.random() * (H - margin * 2 - 100) + 50;
    const pipe = {
      x: W + PIPE_WIDTH,
      gapCenter: gapCenter,
      gapSize: PIPE_GAP,
      passed: false,
      hasRoll: Math.random() < 0.65
    };
    pipes.push(pipe);
    if (pipe.hasRoll) {
      rolls.push({
        x: pipe.x + PIPE_WIDTH / 2,
        y: pipe.gapCenter,
        r: ROLL_SIZE / 2,
        eaten: false,
        bob: Math.random() * Math.PI * 2,
        pipeRef: pipe
      });
    }
  }

  function flap() {
    if (state === 'ready') {
      startGame();
      return;
    }
    if (state === 'over') return;
    bird.vy = FLAP_VELOCITY;
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: bird.x - 10,
        y: bird.y + 10,
        vx: -60 - Math.random() * 60,
        vy: (Math.random() - 0.5) * 80,
        life: 0.4 + Math.random() * 0.2,
        age: 0,
        size: 2 + Math.random() * 3
      });
    }
  }

  function startGame() {
    resetGame();
    state = 'playing';
    overlay.style.display = 'none';
  }

  function endGame() {
    state = 'over';
    if (score > best) {
      best = score;
      try { localStorage.setItem('jarradbird_best', String(best)); } catch(e) {}
    }
    overlay.style.display = 'flex';
    overlay.innerHTML =
      '<h1>Splat!</h1>' +
      '<p>Jarrad hit some celery. Score: <b>' + score + '</b> &middot; Rolls eaten: <b>' + rollsEaten + '</b></p>' +
      '<p class="sub">Best score: ' + best + '</p>' +
      '<button class="btn" id="startBtn">Fly Again</button>';
    document.getElementById('startBtn').addEventListener('click', startGame);
  }

  startBtn.addEventListener('click', startGame);

  window.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      flap();
    }
  });
  container.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    flap();
  });

  // ---------- Drawing helpers ----------
  function drawBackground(dt) {
    // sky gradient handled by CSS; draw clouds
    ctx.save();
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = '#ffffff';
    bgClouds.forEach(c => {
      c.x -= c.speed * dt;
      if (c.x < -60) c.x = W + 60;
      drawCloud(c.x, c.y, c.scale);
    });
    ctx.restore();

    // ground
    groundOffset -= PIPE_SPEED * dt;
    if (groundOffset < -40) groundOffset += 40;
    const groundH = 26;
    ctx.fillStyle = '#8a5a2b';
    ctx.fillRect(0, H - groundH, W, groundH);
    ctx.fillStyle = '#6b4420';
    for (let x = groundOffset; x < W; x += 40) {
      ctx.fillRect(x, H - groundH, 20, 6);
    }
    ctx.fillStyle = '#5cb85c';
    ctx.fillRect(0, H - groundH - 6, W, 6);
  }

  function drawCloud(x, y, scale) {
    ctx.beginPath();
    ctx.ellipse(x, y, 22 * scale, 12 * scale, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 16 * scale, y + 4 * scale, 16 * scale, 10 * scale, 0, 0, Math.PI * 2);
    ctx.ellipse(x - 16 * scale, y + 5 * scale, 15 * scale, 9 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  let bgClouds = [];
  function initClouds() {
    bgClouds = [];
    for (let i = 0; i < 5; i++) {
      bgClouds.push({
        x: Math.random() * W,
        y: 30 + Math.random() * (H * 0.4),
        scale: 0.7 + Math.random() * 1.1,
        speed: 8 + Math.random() * 12
      });
    }
  }

  function drawCeleryStick(x, topY, bottomY) {
    // topY/bottomY define the pipe segment's vertical extent (from 0 to gapTop, or gapBottom to H)
    const w = PIPE_WIDTH;
    const h = bottomY - topY;
    if (h <= 0) return;
    ctx.save();
    ctx.translate(x, topY);

    // main stalk body
    const grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, '#9fd171');
    grad.addColorStop(0.15, '#c3e89a');
    grad.addColorStop(0.5, '#a9d97f');
    grad.addColorStop(0.85, '#c3e89a');
    grad.addColorStop(1, '#8fc366');
    ctx.fillStyle = grad;

    // rounded outer edge
    const r = 10;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(w, 0);
    ctx.lineTo(w, h);
    ctx.quadraticCurveTo(w, h + r, w - r, h + r);
    ctx.lineTo(r, h + r);
    ctx.quadraticCurveTo(0, h + r, 0, h);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#6f9e46';
    ctx.lineWidth = 2;
    ctx.stroke();

    // rib lines (celery texture)
    ctx.strokeStyle = 'rgba(111,158,70,0.55)';
    ctx.lineWidth = 1.5;
    for (let rx = 8; rx < w; rx += 9) {
      ctx.beginPath();
      ctx.moveTo(rx, 4);
      ctx.lineTo(rx, h - 4 > 4 ? h - 4 : 4);
      ctx.stroke();
    }

    // cut end cap (lighter, shows the celery cross-section) at the gap-facing end
    ctx.fillStyle = '#e7f3d3';
    ctx.beginPath();
    ctx.ellipse(w / 2, h, w / 2 - 3, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#8fbf5e';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // little fibrous dots on cross-section
    ctx.fillStyle = 'rgba(111,158,70,0.5)';
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(w / 2 + Math.cos(a) * (w / 2 - 8), h + Math.sin(a) * 5, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawPipe(pipe) {
    const gapTop = pipe.gapCenter - pipe.gapSize / 2;
    const gapBottom = pipe.gapCenter + pipe.gapSize / 2;
    // top stick grows downward from y=0 to gapTop -> draw flipped
    ctx.save();
    ctx.translate(0, gapTop);
    ctx.scale(1, -1);
    drawCeleryStick(pipe.x, 0, gapTop);
    ctx.restore();
    // bottom stick from gapBottom to H
    drawCeleryStick(pipe.x, gapBottom, H - 26);
  }

  function drawSausageRoll(roll) {
    if (roll.eaten) return;
    ctx.save();
    const bobY = roll.y + Math.sin(roll.bob) * 6;
    ctx.translate(roll.x, bobY);
    ctx.rotate(-0.1);
    // pastry body
    const grad = ctx.createLinearGradient(-16, -9, 16, 9);
    grad.addColorStop(0, '#e8b25a');
    grad.addColorStop(0.5, '#f2c877');
    grad.addColorStop(1, '#d99b3f');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#a9701f';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // pastry flakes / lines
    ctx.strokeStyle = 'rgba(169,112,31,0.6)';
    ctx.lineWidth = 1;
    for (let i = -10; i <= 10; i += 6) {
      ctx.beginPath();
      ctx.moveTo(i, -7);
      ctx.lineTo(i + 3, 7);
      ctx.stroke();
    }
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(-5, -4, 5, 2, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBird(dt) {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    const rot = Math.max(-0.5, Math.min(1.1, bird.vy / 500));
    ctx.rotate(rot);

    // wing (simple flap animation)
    const wingPhase = Math.sin(Date.now() / 90);
    ctx.save();
    ctx.translate(-BIRD_SIZE * 0.25, 4);
    ctx.rotate(wingPhase * 0.5 - 0.2);
    ctx.fillStyle = '#f4a825';
    ctx.beginPath();
    ctx.ellipse(0, 0, BIRD_SIZE * 0.32, BIRD_SIZE * 0.18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#b5651d';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    // body circle backdrop (in case image has transparency edges)
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_SIZE / 2 + 2, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd88a';
    ctx.fill();

    // clip circular and draw the photo
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_SIZE / 2, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(birdImg, -BIRD_SIZE / 2, -BIRD_SIZE / 2, BIRD_SIZE, BIRD_SIZE);
    ctx.restore();

    ctx.beginPath();
    ctx.arc(0, 0, BIRD_SIZE / 2, 0, Math.PI * 2);
    ctx.strokeStyle = '#b5651d';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // beak
    ctx.fillStyle = '#f4a825';
    ctx.beginPath();
    ctx.moveTo(BIRD_SIZE / 2 - 4, 2);
    ctx.lineTo(BIRD_SIZE / 2 + 10, 6);
    ctx.lineTo(BIRD_SIZE / 2 - 4, 10);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#b5651d';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
  }

  function drawParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt;
      if (p.age > p.life) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const alpha = 1 - p.age / p.life;
      ctx.fillStyle = 'rgba(255,255,255,' + (alpha * 0.7) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function circleRectCollide(cx, cy, cr, rx, ry, rw, rh) {
    const closestX = Math.max(rx, Math.min(cx, rx + rw));
    const closestY = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - closestX;
    const dy = cy - closestY;
    return (dx * dx + dy * dy) < (cr * cr);
  }

  function update(dt) {
    if (state !== 'playing') return;

    bird.vy += GRAVITY * dt;
    if (bird.vy > MAX_FALL_SPEED) bird.vy = MAX_FALL_SPEED;
    bird.y += bird.vy * dt;

    spawnTimer += dt * 1000;
    if (spawnTimer >= PIPE_INTERVAL) {
      spawnTimer = 0;
      spawnPipe();
    }

    const groundY = H - 26;
    const birdR = BIRD_SIZE / 2 - 4;

    if (bird.y - birdR <= 0) {
      bird.y = birdR;
      bird.vy = 0;
    }
    if (bird.y + birdR >= groundY) {
      bird.y = groundY - birdR;
      endGame();
      return;
    }

    for (let i = pipes.length - 1; i >= 0; i--) {
      const pipe = pipes[i];
      pipe.x -= PIPE_SPEED * dt;

      const gapTop = pipe.gapCenter - pipe.gapSize / 2;
      const gapBottom = pipe.gapCenter + pipe.gapSize / 2;

      if (circleRectCollide(bird.x, bird.y, birdR, pipe.x, 0, PIPE_WIDTH, gapTop) ||
          circleRectCollide(bird.x, bird.y, birdR, pipe.x, gapBottom, PIPE_WIDTH, groundY - gapBottom)) {
        endGame();
        return;
      }

      if (!pipe.passed && pipe.x + PIPE_WIDTH < bird.x) {
        pipe.passed = true;
        score += 1;
        scoreDisplay.textContent = String(score);
      }

      if (pipe.x + PIPE_WIDTH < -10) {
        pipes.splice(i, 1);
      }
    }

    for (let i = rolls.length - 1; i >= 0; i--) {
      const roll = rolls[i];
      roll.x = roll.pipeRef.x + PIPE_WIDTH / 2;
      roll.bob += dt * 4;
      if (!roll.eaten) {
        const bobY = roll.y + Math.sin(roll.bob) * 6;
        const dx = bird.x - roll.x;
        const dy = bird.y - bobY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < birdR + roll.r) {
          roll.eaten = true;
          rollsEaten += 1;
          score += 3;
          scoreDisplay.textContent = String(score);
          rollCountDisplay.textContent = '🥐 x' + rollsEaten;
        }
      }
      if (roll.x < -30) rolls.splice(i, 1);
    }
  }

  function render(dt) {
    ctx.clearRect(0, 0, W, H);
    drawBackground(dt);
    pipes.forEach(drawPipe);
    rolls.forEach(drawSausageRoll);
    if (state !== 'ready') drawBird(dt);
    else {
      bird.y = H * 0.45 + Math.sin(Date.now() / 300) * 8;
      drawBird(dt);
    }
    drawParticles(dt);
  }

  function loop(ts) {
    if (!lastTime) lastTime = ts;
    let dt = (ts - lastTime) / 1000;
    if (dt > 0.05) dt = 0.05;
    lastTime = ts;

    update(dt);
    render(dt);

    requestAnimationFrame(loop);
  }

  function boot() {
    resize();
    initClouds();
    resetGame();
    requestAnimationFrame(loop);
  }

  if (birdImg.complete) {
    boot();
  } else {
    birdImg.addEventListener('load', boot);
  }
})();
</script>
</body>
</html>

name: Build Midnight 84

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: Midnight84-Windows-VST3
          - name: macOS
            os: macos-14
            artifact: Midnight84-macOS-VST3-AU
          - name: Linux
            os: ubuntu-24.04
            artifact: Midnight84-Linux-VST3

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R "build/Midnight84_artefacts/Release/VST3/Midnight 84.vst3" dist/
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R "build/Midnight84_artefacts/Release/AU/Midnight 84.component" dist/
            cp -R "build/Midnight84_artefacts/Release/Standalone/Midnight 84.app" dist/
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp "build/Midnight84_artefacts/Release/Standalone/Midnight 84.exe" dist/
          else
            cp "build/Midnight84_artefacts/Release/Standalone/Midnight 84" dist/
          fi
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" .
          else
            zip -r -y "../${{ matrix.artifact }}.zip" .
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip

name: Build Midnight 84

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: Midnight84-Windows-VST3
          - name: macOS
            os: macos-14
            artifact: Midnight84-macOS-VST3-AU
          - name: Linux
            os: ubuntu-24.04
            artifact: Midnight84-Linux-VST3

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R "build/Midnight84_artefacts/Release/VST3/Midnight 84.vst3" dist/
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R "build/Midnight84_artefacts/Release/AU/Midnight 84.component" dist/
            cp -R "build/Midnight84_artefacts/Release/Standalone/Midnight 84.app" dist/
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp "build/Midnight84_artefacts/Release/Standalone/Midnight 84.exe" dist/
          else
            cp "build/Midnight84_artefacts/Release/Standalone/Midnight 84" dist/
          fi
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" .
          else
            zip -r -y "../${{ matrix.artifact }}.zip" .
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip

  # Android: standalone app (APK) built from the same Source/ via a Projucer project,
  # because JUCE's CMake API doesn't support Android.
  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies for Projucer
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libasound2-dev xvfb

      - name: Get JUCE 8.0.4
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE

      - name: Build Projucer
        run: make -C JUCE/extras/Projucer/Builds/LinuxMakefile CONFIG=Release -j4

      - name: Generate the Android Studio project
        run: xvfb-run -a JUCE/extras/Projucer/Builds/LinuxMakefile/build/Projucer --resave android/Midnight84.jucer

      - name: Install the NDK and CMake versions JUCE expects
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;26.2.11394342" "cmake;3.22.1" > /dev/null

      - name: Signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        working-directory: android/Builds/Android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease_Release

      - name: Package
        run: |
          mkdir -p dist
          cp "$(find android/Builds/Android/app/build/outputs/apk -name '*.apk' | head -1)" dist/Midnight84.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Midnight84-Android-APK
          path: dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Midnight84.apk
